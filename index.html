<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Australia 퀴즈 배틀 · Lesson 2</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
:root{--bg:#0b1d33;--bg2:#0f2a47;--card:#132f50;--line:#24496f;--txt:#eaf2fb;--sub:#9db4cc;--p0:#ff6b6b;--p1:#4dabf7;--p2:#51cf66;--ok:#37d67a;--bad:#ff5c5c;--gold:#ffd43b}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:radial-gradient(1200px 600px at 20% -10%,#1b4f7a 0%,transparent 60%),linear-gradient(180deg,var(--bg) 0%,#071423 100%);color:var(--txt);font-family:"Noto Sans KR",system-ui,sans-serif}
.wrap{max-width:860px;margin:0 auto;padding:20px 16px 48px}
h1{margin:6px 0 8px;font-size:28px;line-height:1.25;font-weight:900}
h1 span{background:linear-gradient(90deg,var(--p0),var(--gold),var(--p1));-webkit-background-clip:text;background-clip:text;color:transparent}
h2{margin:0 0 6px;font-size:18px}
.tag{display:inline-block;font-size:12px;color:var(--sub);border:1px solid var(--line);border-radius:99px;padding:3px 10px}
.hero p{color:var(--sub);margin:0 0 14px;line-height:1.6}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0}
.sub{color:var(--sub);font-size:14px;margin:0 0 12px;line-height:1.5}
.tiny{color:var(--sub);font-size:12px;margin:10px 0 0;line-height:1.5}
label.f{display:block;font-size:14px;color:var(--sub);margin-bottom:10px}
input[type=text]{width:100%;margin-top:4px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:#0b2440;color:var(--txt);font:inherit;font-size:16px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}
.lbl{font-size:14px;color:var(--sub);min-width:70px}
.chk{display:flex;align-items:center;gap:6px;background:#0b2440;border:1px solid var(--line);border-radius:10px;padding:7px 10px;font-size:14px;cursor:pointer}
select{padding:8px 10px;border-radius:10px;background:#0b2440;color:var(--txt);border:1px solid var(--line);font:inherit}
.btn{appearance:none;border:0;border-radius:12px;padding:12px 18px;font:inherit;font-weight:700;font-size:16px;cursor:pointer;background:linear-gradient(135deg,#ff8a5b,#ff5e7e);color:#fff;box-shadow:0 4px 14px rgba(255,94,126,.3)}
.btn.alt{background:linear-gradient(135deg,#4dabf7,#3b5bdb);box-shadow:0 4px 14px rgba(77,171,247,.3)}
.btn.ghost{background:transparent;border:1px solid var(--line);box-shadow:none;color:var(--txt)}
.btn.big{width:100%;padding:14px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.joinrow{display:flex;gap:8px;margin-top:10px}
.joinrow input{margin:0;text-transform:uppercase;letter-spacing:4px;font-weight:700}
#flash{color:var(--gold);min-height:20px;text-align:center}
.code{font-size:56px;font-weight:900;letter-spacing:12px;text-align:center;margin:8px 0;color:var(--gold)}
.plist{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.pslot{border:1px dashed var(--line);border-radius:12px;padding:14px;text-align:center}
.pslot.on{border-style:solid}
.pslot.s0.on{border-color:var(--p0)} .pslot.s1.on{border-color:var(--p1)}
.fighters{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:stretch}
.vs{align-self:center;font-weight:900;font-size:22px;color:var(--gold)}
.fc{position:relative;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:10px 12px}
.fc.f0{border-color:rgba(255,107,107,.6)} .fc.f1{border-color:rgba(77,171,247,.6)}
.fc .nm{font-weight:900;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me{font-size:11px;background:var(--gold);color:#222;border-radius:6px;padding:1px 6px;margin-left:4px;vertical-align:middle}
.hp{height:14px;background:#0a2038;border-radius:8px;overflow:hidden;margin:8px 0 4px}
.hp i{display:block;height:100%;border-radius:8px;transition:width .6s ease}
.f0 .hp i{background:linear-gradient(90deg,#ff6b6b,#ffa94d)} .f1 .hp i{background:linear-gradient(90deg,#4dabf7,#63e6be)}
.hpn{font-size:12px;color:var(--sub)}
.st{font-size:13px;margin-top:4px;min-height:18px}
.st.ok{color:var(--ok)} .st.bad{color:var(--bad)}
.fc.hit{animation:shake .5s}
.dmg{position:absolute;right:10px;top:-8px;font-weight:900;font-size:22px;color:var(--bad);animation:up 1.2s forwards}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
@keyframes up{0%{opacity:0;transform:translateY(8px)}20%{opacity:1}100%{opacity:0;transform:translateY(-22px)}}
.meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:14px 0 8px;color:var(--sub);font-size:14px}
.chip{font-size:12px;border:1px solid var(--line);border-radius:99px;padding:2px 9px;color:var(--txt)}
.timer{position:relative;height:10px;background:#0a2038;border-radius:6px;overflow:hidden}
#tbar{height:100%;width:100%;background:linear-gradient(90deg,var(--ok),var(--gold));transition:width .1s linear}
#tbar.low{background:linear-gradient(90deg,var(--bad),#ff922b)}
.tsec{text-align:right;font-size:12px;color:var(--sub);margin-top:2px}
.qcard{background:#f7fbff;color:#13253a;border-radius:16px;padding:18px;margin-top:6px}
.q{font-size:18px;line-height:1.6;font-weight:500;margin-bottom:12px}
.q b{color:#c92a2a} .q u{text-decoration-thickness:2px}
.opts{display:grid;gap:8px}
.opt{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:12px 14px;border-radius:12px;border:2px solid #d6e4f0;background:#fff;color:#13253a;font:inherit;font-size:16px;cursor:pointer}
.opt:hover:not(:disabled){border-color:#4dabf7;background:#eef7ff}
.opt:disabled{cursor:default;opacity:1}
.opt .mk{font-weight:900;color:#3b5bdb}
.opt .ot{flex:1}
.opt kbd{font-family:inherit;font-size:11px;color:#7a8ea3;border:1px solid #c9d6e3;border-radius:5px;padding:0 5px}
.opt.picked{border-color:#3b5bdb;background:#e7efff}
.opt.correct{border-color:var(--ok);background:#e6fcef}
.opt.wrong{border-color:var(--bad);background:#fff0f0}
.pk{font-size:11px;font-weight:700;color:#fff;border-radius:6px;padding:2px 6px;max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pk.p0{background:var(--p0)} .pk.p1{background:var(--p1)}
.explain{margin-top:12px;background:#fff8db;border-radius:12px;padding:12px;font-size:15px;line-height:1.6;color:#4a3b00}
.pads{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.pad{background:var(--card);border-radius:14px;padding:10px;border:2px solid var(--line)}
.pad.p0{border-color:rgba(255,107,107,.6)} .pad.p1{border-color:rgba(77,171,247,.6)}
.pad .pn{font-weight:700;font-size:14px;margin-bottom:6px}
.pbtns{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.pbtns button{padding:14px 0;border-radius:10px;border:0;font:inherit;font-weight:900;font-size:18px;cursor:pointer;color:#fff}
.pad.p0 .pbtns button{background:#c94b4b} .pad.p1 .pbtns button{background:#2f7fc1}
.pbtns button small{display:block;font-size:10px;font-weight:500;opacity:.8}
.pbtns button:disabled{opacity:.35;cursor:default}
.pst{font-size:13px;color:var(--ok);margin-top:6px;min-height:18px;text-align:center}
.bar{display:flex;gap:8px;justify-content:space-between;align-items:center;margin-top:12px;flex-wrap:wrap}
.banner{background:#3b2a00;color:var(--gold);border:1px solid #6b5100;border-radius:10px;padding:8px 12px;font-size:14px;margin-bottom:10px}
.endbox{text-align:center;padding:24px 16px}
.endbox .big{font-size:40px;font-weight:900;margin:8px 0}
.score{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}
.score div{background:#0b2440;border-radius:12px;padding:12px}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;color:var(--sub);font-size:13px}
.linkbtn{background:none;border:0;color:var(--sub);text-decoration:underline;cursor:pointer;font:inherit;font-size:13px}
@media (max-width:560px){h1{font-size:23px}.q{font-size:16px}.code{font-size:44px}.fc .nm{font-size:14px}}

.games{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0 10px}
.gcard{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:12px;border-radius:12px;border:2px solid var(--line);background:#0b2440;color:var(--txt);font:inherit;cursor:pointer}
.gcard .gi{font-size:22px}.gcard small{color:var(--sub);font-size:12px;line-height:1.4}
.gcard.on{border-color:var(--gold);background:#1d3a5c}
.gcard:disabled{cursor:default;opacity:.85}.gcard:disabled:not(.on){opacity:.4}
.seg{padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:#0b2440;color:var(--txt);font:inherit;font-size:14px;cursor:pointer}
.seg.on{background:var(--gold);color:#1b1b1b;border-color:var(--gold);font-weight:700}
.seg:disabled{cursor:default}.seg:disabled:not(.on){opacity:.4}
.seg small{opacity:.7}
.mlist{display:grid;gap:6px;margin:8px 0}
.mrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:#0b2440;border-radius:10px;padding:8px 10px}
.mrow .mn{font-weight:700}.mrow .mb{margin-left:auto;display:flex;gap:6px}
.bd{font-size:12px;border-radius:6px;padding:2px 7px}.bd.h{background:#5c4600;color:var(--gold)}.bd.o{background:#1f3f66;color:#a5d8ff}.bd.s{background:#2a3a4d;color:var(--sub)}
.mini{font:inherit;font-size:12px;padding:5px 9px;border-radius:8px;border:1px solid var(--line);background:#132f50;color:var(--txt);cursor:pointer}
.mini.gold{border-color:#8a6d00;color:var(--gold)}
.hint{margin-top:10px;font-size:26px;letter-spacing:3px;font-weight:700;color:#3b5bdb}.hint small{font-size:13px;letter-spacing:0;color:#7a8ea3;margin-left:8px;font-weight:400}
.typerow{display:flex;gap:8px}.typerow input{flex:1;margin:0;background:#fff;color:#13253a;border:2px solid #c9d6e3;font-size:18px}
.typerow input:disabled{background:#eef2f6}
.typeres{display:grid;gap:6px;font-size:16px}
.oxgrid{grid-template-columns:1fr 1fr}
.opt.ox{justify-content:center;padding:18px}
.oxl{font-size:40px;font-weight:900;line-height:1}.oxl.o{color:#1c7ed6}.oxl.x{color:#e03131}
@media (max-width:560px){.games{grid-template-columns:1fr}.gcard{flex-direction:row;align-items:center;gap:8px}.gcard small{margin-left:auto}}

.f2 .hp i{background:linear-gradient(90deg,#51cf66,#d8f5a2)}
.fc{border-color:var(--pc)!important;text-align:center}
.fc .nm{margin-top:2px}
.fighters.n3{grid-template-columns:1fr 1fr 1fr}
.pad{border-color:var(--pc)!important}
.pad .pbtns button{background:var(--pc)!important}
.pk{color:#fff}
/* 캐릭터 */
.ava{position:relative;display:inline-flex;align-items:center;justify-content:center;line-height:1;font-size:48px;width:1.5em;height:1.5em;border-radius:50%;background:radial-gradient(circle at 50% 35%,rgba(255,255,255,.18),rgba(255,255,255,.04));margin:2px auto}
.ava .emo{display:inline-block;transform-origin:50% 90%}
.ava .bub{position:absolute;bottom:92%;left:50%;transform:translateX(-50%);white-space:nowrap;background:#fff;color:#1b2b3c;font-size:12px;font-weight:700;padding:4px 8px;border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,.3);animation:pop .3s ease;z-index:2;max-width:160px;overflow:hidden;text-overflow:ellipsis}
.ava .bub:after{content:"";position:absolute;top:100%;left:50%;margin-left:-5px;border:5px solid transparent;border-top-color:#fff}
.ava.idle .emo{animation:bob 2.2s ease-in-out infinite}
.ava.think .emo{animation:bob 1s ease-in-out infinite}
.ava.think .bub{background:var(--ok);color:#fff}
.ava.happy .emo{animation:jump .7s ease 2}
.ava.happy{box-shadow:0 0 0 3px var(--ok),0 0 22px rgba(55,214,122,.6)}
.ava.sad .emo{animation:sadshake .6s ease;filter:saturate(.5);transform:rotate(-12deg)}
.ava.sleep .emo{opacity:.6;transform:rotate(-15deg)}
.ava.hit{animation:hitflash .5s ease 2}
.ava.ko .emo{transform:rotate(90deg) translateX(10%);filter:grayscale(1);opacity:.55}
.ava.ko:after{content:"💫";position:absolute;top:-6px;right:-4px;font-size:.4em}
.ava.win .emo{animation:dance .8s ease-in-out infinite}
.ava.win:before{content:"👑";position:absolute;top:-.55em;font-size:.45em}
.ava.lose .emo{filter:grayscale(.6);transform:rotate(-10deg) scale(.95)}
.ava.main{background:radial-gradient(circle at 50% 40%,rgba(255,212,59,.35),rgba(255,212,59,0) 70%)}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6%)}}
@keyframes jump{0%{transform:translateY(0) scale(1)}30%{transform:translateY(-35%) scale(1.15) rotate(-8deg)}60%{transform:translateY(0) scale(.95,1.05)}80%{transform:translateY(-10%) rotate(6deg)}100%{transform:translateY(0)}}
@keyframes sadshake{0%,100%{translate:0}25%{translate:-8% 0}50%{translate:8% 0}75%{translate:-4% 0}}
@keyframes hitflash{0%,100%{background-color:transparent}50%{background-color:rgba(255,92,92,.55)}}
@keyframes dance{0%,100%{transform:rotate(-10deg) translateY(0)}50%{transform:rotate(10deg) translateY(-10%)}}
@keyframes pop{0%{transform:translateX(-50%) scale(.3);opacity:0}100%{transform:translateX(-50%) scale(1);opacity:1}}
/* 지갑·상점 */
.wbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:8px}
.tok{font-weight:900;color:var(--gold);font-size:16px}
.wwhere{font-size:11px;color:var(--sub)}
.wbar .mini{margin-left:auto}
.mehero{display:flex;gap:14px;align-items:center}
.modal{position:fixed;inset:0;background:rgba(3,10,20,.75);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.mbox{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;width:100%;max-width:560px;max-height:85vh;overflow:auto}
.mhead{display:flex;align-items:center;gap:10px;margin-bottom:6px}.mhead .linkbtn{margin-left:auto}
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.sc{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 6px;border-radius:12px;border:2px solid var(--line);background:#0b2440;color:var(--txt);font:inherit;cursor:pointer}
.sc .se{font-size:40px;line-height:1.1}.sc small{font-size:11px;color:var(--sub)}
.sc.sel{border-color:var(--gold);background:#2b3d1f}.sc.sel small{color:var(--gold)}
.sc.lock .se{filter:grayscale(1) brightness(.6)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:#1d3a5c;color:var(--gold);border:1px solid var(--gold);padding:10px 16px;border-radius:12px;font-weight:700;opacity:0;transition:.25s;z-index:60;pointer-events:none}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* 대기실 */
.stage{text-align:center;position:relative;padding-top:26px;background:radial-gradient(500px 220px at 50% 0%,rgba(255,212,59,.12),transparent 70%),var(--card)}
.codebadge{position:absolute;top:10px;right:12px;font-size:12px;color:var(--sub)}.codebadge b{color:var(--gold);letter-spacing:2px;font-size:16px}
.mainname{font-size:24px;font-weight:900;margin-top:6px}
.mainrole{color:var(--sub);font-size:14px}
.stage .wbar{justify-content:center}.stage .wbar .mini{margin-left:0}
.others{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:14px;padding-top:12px;border-top:1px dashed var(--line)}
.om{display:flex;flex-direction:column;align-items:center}.omn{font-size:12px;color:var(--sub);max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrow .ava{margin:0}
.podium{display:flex;justify-content:center;align-items:flex-end;gap:14px;flex-wrap:wrap;margin:14px 0}
.pod{display:flex;flex-direction:column;align-items:center;padding:8px 10px;border-radius:12px;border-top:3px solid var(--pc);background:#0b2440;min-width:110px}
@media (max-width:560px){.fighters.n3 .fc{padding:8px 6px}.fighters.n3 .nm{font-size:12px}.ava .bub{font-size:11px;max-width:110px}}

/* v7: 아이템·콤보·이모티콘·봇·오답노트 */
.items{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.itm{display:flex;flex-direction:column;align-items:center;gap:1px;padding:8px;border-radius:12px;border:2px solid var(--line);background:#0b2440;color:var(--txt);font:inherit;font-weight:700;cursor:pointer}
.itm small{font-weight:400;color:var(--sub);font-size:11px}
.itm.on{border-color:#74c0fc;background:#123a63;box-shadow:0 0 14px rgba(116,192,252,.6)}
.itm:disabled{opacity:.4;cursor:default}
.emobar{display:flex;gap:6px;justify-content:center;margin:8px 0;flex-wrap:wrap}
.emob{font-size:22px;line-height:1;padding:6px 8px;border-radius:10px;border:1px solid var(--line);background:#0b2440;cursor:pointer;transition:transform .1s}
.emob:active{transform:scale(1.3)}
.ava .emote{position:absolute;top:-.35em;right:-.45em;font-size:.6em;animation:emopop 2.6s ease forwards;z-index:3}
@keyframes emopop{0%{transform:scale(0) rotate(-20deg);opacity:0}12%{transform:scale(1.35) rotate(10deg);opacity:1}25%{transform:scale(1)}80%{opacity:1;transform:translateY(-6px)}100%{opacity:0;transform:translateY(-16px)}}
.combo{position:absolute;left:8px;top:6px;font-size:13px;font-weight:900;color:#ff922b;text-shadow:0 0 8px rgba(255,146,43,.8);animation:bob 1s ease-in-out infinite}
.cb{color:#ff922b;font-weight:900}
.ava.fire{box-shadow:0 0 0 3px #ff922b,0 0 26px rgba(255,146,43,.8)}
.ava.guard{box-shadow:0 0 0 3px #74c0fc,0 0 24px rgba(116,192,252,.8)}
.ava.guard:after{content:"🛡️";position:absolute;left:-8px;bottom:-4px;font-size:.45em}
.crowd{text-align:center;font-size:13px;color:var(--sub);margin-top:6px}
.hintline{font-size:22px;letter-spacing:2px;font-weight:700;color:#e67700;margin:0 0 8px}
.opt.gone{opacity:.25;text-decoration:line-through}
.padsh{width:100%;margin-top:6px;padding:6px;border-radius:8px;border:1px solid var(--line);background:#0b2440;color:var(--txt);font:inherit;font-size:12px;cursor:pointer}
.padsh.on{border-color:#74c0fc;background:#123a63}
.padsh:disabled{opacity:.4}
.botrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.botbtn{display:flex;flex-direction:column;align-items:center;gap:2px;padding:12px 6px;border-radius:12px;border:2px solid var(--line);background:#0b2440;color:var(--txt);font:inherit;cursor:pointer}
.botbtn:hover{border-color:var(--gold)}
.botbtn .bi{font-size:30px}.botbtn small{color:var(--sub);font-size:11px}
.rules{margin-top:10px;font-size:14px;color:var(--sub)}
.rules summary{cursor:pointer;color:var(--txt);font-weight:700}
.rules ul{margin:8px 0 0;padding-left:18px;line-height:1.7}
.wrongs{text-align:left;background:#0b2440;border-radius:12px;padding:10px 12px;margin:0 0 12px}
.wrongs summary{cursor:pointer;font-weight:700;color:var(--gold)}
.wq{background:#f7fbff;color:#13253a;border-radius:10px;padding:10px;margin-top:8px;font-size:14px;line-height:1.6}
.wqq{margin-bottom:6px}.wqq b{color:#c92a2a}.wqa{color:#2b8a3e;font-weight:700}.wqe{color:#5c4600}
.abc{margin-top:8px;padding:10px 12px;border-left:4px solid #4dabf7;background:#eef7ff;border-radius:8px;font-size:16px;line-height:1.8}
.abc b{color:#1c7ed6}
@media (max-width:560px){.botrow{grid-template-columns:repeat(3,1fr)}.emob{font-size:20px;padding:5px 6px}}
/* v8: 화면 맞춤 · 채팅 */
html{overflow-x:hidden;overscroll-behavior-y:none}
body{overflow-x:clip}
.q,.opt .ot,.explain,.abc,.typeres,.wq{overflow-wrap:anywhere}
.tb{display:flex;align-items:center;gap:8px;flex-shrink:0}
.battle{height:100vh;height:100dvh;max-width:1200px;margin:0 auto;padding:8px 12px calc(8px + env(safe-area-inset-bottom));display:grid;grid-template-rows:auto auto minmax(0,1fr);gap:6px;overflow:hidden}
.battle .topbar{margin-bottom:2px;font-size:12px;gap:8px}

const BANK = [
// ---------- 구간 1: 도입 ~ 펭귄 퍼레이드 (p.38~39) ----------
{s:1,c:"어휘",q:"I had the <b>remarkable</b> opportunity ... 에서 remarkable의 뜻은?",o:["놀라운, 특별한","평범한","위험한","지루한"],a:0,e:"remarkable = 놀라운, 주목할 만한"},
{s:1,c:"내용",q:"글쓴이의 삼촌의 직업은?",o:["야생동물 생물학자","여행 가이드","사진작가","수의사"],a:0,e:"My uncle, a wildlife biologist conducting research on Australian animals"},
{s:1,c:"문법",q:"My uncle, a wildlife biologist conducting research on Australian animals, ______ me to join him on an ecotour.<br>빈칸에 알맞은 것은?",o:["invited","inviting","to invite","invite"],a:0,e:"주어 My uncle의 동사 자리 → invited (콤마 사이는 동격)"},
{s:1,c:"문법",q:"<b>Knowing</b> that I was passionate about animals and nature, he thought ... 에서 Knowing과 뜻이 같은 것은?",o:["Because he knew","Although he knew","If he knew","Before he knew"],a:0,e:"이유를 나타내는 분사구문 = Because he knew"},
{s:1,c:"어휘",q:"<b>Upon arriving</b> in Melbourne 의 뜻은?",o:["멜버른에 도착하자마자","멜버른에 도착하기 전에","멜버른에 도착하지 못해서","멜버른에 도착하는 대신"],a:0,e:"upon(on) -ing = ~하자마자"},
{s:1,c:"내용",q:"멜버른에 도착했을 때 글쓴이를 맞이한 것은?",o:["쌀쌀한 공기","습한 더위","거센 비","뜨거운 햇볕"],a:0,e:"I was greeted by the chilly air — 한국에 두고 온 humid heat와 대조"},
{s:1,c:"어휘",q:"a sharp contrast to the <b>humid</b> heat 에서 humid의 뜻은?",o:["습한","건조한","추운","시원한"],a:0,e:"humid = 습한"},
{s:1,c:"문법",q:"Realizing ______ I was made me even more excited.<br>빈칸에 알맞은 것은? (간접의문문)",o:["where","what","which","who"],a:0,e:"내가 어디에 있는지 = where I was (간접의문문: 의문사+주어+동사)"},
{s:1,c:"문법",q:"Realizing where I was made me even more <b>excited</b>. excited를 쓴 이유는?",o:["me가 신나는 감정을 느끼는 쪽이라서","made 뒤에는 항상 -ed가 와서","주어가 동명사라서","비교급 more 때문에"],a:0,e:"감정을 느끼는 대상(me) → 과거분사 excited (make + O + 형용사 보어)"},

{s:1,c:"어휘",q:"My trip to Australia <b>was filled with</b> visits ... 의 뜻은?",o:["~로 가득 차 있었다","~이 부족했다","~와 비교되었다","~ 때문에 취소되었다"],a:0,e:"be filled with = ~로 가득 차다"},
{s:1,c:"어휘",q:"<b>encounters</b> with incredible nature 에서 encounter의 뜻은?",o:["(뜻밖의) 만남, 마주침","보호","탐험 장비","예약"],a:0,e:"encounter = 마주침, 만남"},
{s:1,c:"내용",q:"글쓴이는 여행에서 가장 기억에 남는 장소를 몇 곳 소개한다고 했나?",o:["4곳","2곳","3곳","5곳"],a:0,e:"I will share four of the most memorable destinations"},
{s:1,c:"문법",q:"Phillip Island, <b>which</b> is just a two-hour drive from Melbourne ... 에서 , which를 바꿔 쓴 것으로 알맞은 것은?",o:["and it","but it","that","what"],a:0,e:"계속적 용법 관계대명사 , which = and it (콤마 뒤에는 that 불가)"},
{s:1,c:"내용",q:"Phillip Island는 멜버른에서 얼마나 걸리나?",o:["차로 2시간","차로 4시간","비행기로 2시간","배로 1시간"],a:0,e:"just a two-hour drive from Melbourne"},
{s:1,c:"내용",q:"little blue penguins의 키는?",o:["35~42cm","25~32cm","45~52cm","60~70cm"],a:0,e:"measuring only 35 to 42 centimeters in height"},
{s:1,c:"내용",q:"little blue penguins의 크기를 무엇과 비교했나?",o:["볼링 핀보다 약간 크다","축구공보다 작다","고양이만 하다","볼링공보다 약간 작다"],a:0,e:"slightly bigger than a bowling pin"},

/* ====== 온라인 연결 (PeerJS · 로그인 없이 링크만으로) ======
   방을 만든 사람의 브라우저가 중계소가 되고, 참가자들은 거기에 접속한다.
   Claude 버전의 room.presence / peers / onPeers 와 똑같은 모양으로 만들어서 게임 코드는 그대로 쓴다. */
const NET_PREFIX = "bq-aus-lesson2-";
function makeNet(){
  let peer = null, isRelay = false, hostConn = null;
  const conns = new Map();
  let myId = "local-" + makeCode(8);
  const pres = new Map([[myId, {}]]);
  const subs = [];
  let pending = false;
  const list = () => [...pres.entries()].map(([id, p]) => ({ peer: id, presence: p, sameTab: id === myId, isMe: id === myId }));
  function notify(){
    if (pending) return; pending = true;
    setTimeout(() => { pending = false; const ps = list(); subs.forEach(f => { try { f({ peers: ps }); } catch (e) { console.error(e); } }); }, 0);
  }
  function relayAll(){ const all = Object.fromEntries(pres); for (const c of conns.values()) if (c.open) { try { c.send({ t: "all", all }); } catch (e) {} } }
  function adoptId(id){ const mine = pres.get(myId) || {}; pres.delete(myId); myId = id; pres.set(myId, mine); }
  function reset(){
    if (peer){ try { peer.destroy(); } catch (e) {} }
    peer = null; isRelay = false; hostConn = null; conns.clear();
    const mine = pres.get(myId) || {}; pres.clear(); myId = "local-" + makeCode(8); pres.set(myId, mine); notify();
  }
  const okObj = d => d && typeof d === "object" && !Array.isArray(d);
  const api = {
    onError: null,
    presence(patch){
      const cur = { ...(pres.get(myId) || {}) };
      for (const k in patch){ if (patch[k] === null) delete cur[k]; else cur[k] = JSON.parse(JSON.stringify(patch[k])); }
      pres.set(myId, cur);
      if (isRelay) relayAll();
      else if (hostConn && hostConn.open){ try { hostConn.send({ t: "p", p: cur }); } catch (e) {} }
      notify();
      return Promise.resolve();
    },
    peers(){ return list(); },
    onPeers(fn){ subs.push(fn); return () => {}; },
    host(code){
      reset();
      return new Promise((res, rej) => {
        const p = new Peer(NET_PREFIX + code, { debug: 0 }); peer = p; let done = false;
        p.on("open", id => { done = true; adoptId(id); isRelay = true; notify(); res(); });
        p.on("error", e => { if (!done){ done = true; try { p.destroy(); } catch (x) {} peer = null; rej(e); } else if (api.onError) api.onError(e); });
        p.on("disconnected", () => { try { p.reconnect(); } catch (e) {} });
        p.on("connection", c => {
          c.on("open", () => { conns.set(c.peer, c); if (!pres.has(c.peer)) pres.set(c.peer, {}); relayAll(); notify(); });
          c.on("data", d => {
            if (!okObj(d) || d.t !== "p" || !okObj(d.p)) return;
            if (JSON.stringify(d.p).length > 8000) return;
            pres.set(c.peer, d.p); relayAll(); notify();
          });
          const drop = () => { if (!conns.has(c.peer)) return; conns.delete(c.peer); pres.delete(c.peer); relayAll(); notify(); };
          c.on("close", drop); c.on("error", drop);
        });
        setTimeout(() => { if (!done){ done = true; rej({ type: "timeout" }); } }, 15000);
      });
    },
    join(code){
      reset();
      return new Promise((res, rej) => {
        const p = new Peer({ debug: 0 }); peer = p; let done = false;
        p.on("open", id => {
          adoptId(id); notify();
          const c = p.connect(NET_PREFIX + code, { reliable: true }); hostConn = c;

  for (let k = 0; k < n; k++){
    let r = Math.random(), rar = 1;
    for (let i = 4; i >= 1; i--){ const cum = RARITY.slice(i).reduce((a, x) => a + x.p, 0); if (r < cum){ rar = i; break; } }
    // 5연속 뽑기는 희귀 이상 1개 보장
    if (n === 5 && k === 4 && res.every(x => ITEM[x.id].rar < 2) && rar < 2) rar = 2;
    const pool = ITEMS.filter(x => x.rar === rar);
    const it = pool[Math.floor(Math.random() * pool.length)];
    const dup = wallet.inv.includes(it.id);
    if (dup) wallet.tokens += RARITY[rar].refund; else wallet.inv.push(it.id);

}

/* ====== 게임 엔진 (2~3인) ====== */
function newGame(names, chars, peers, set, extra){
  const pool = poolFor(set), order = shuffle(pool), n = names.length;
  const g = Object.assign({ gid: makeCode(6), v: 1, phase: "q", set: { ...set, sec: set.sec.slice(), cats: set.cats.slice() }, tl: GAMES[set.game].tl[set.speed ? 1 : 0],

           stats: names.map(() => ({ ok: 0 })), combo: Array(n).fill(0), items: names.map(() => ({ sh: 1 })) }, extra || {});
  // ⚙️ 장비 특성 적용
  g.perks = names.map((_, p) => perksOf(g.gears && g.gears[p]));

}
function waitState(names, chars, peers, set){
  return { maxhp: names.map(() => 100), gid: makeCode(6), v: 1, phase: "wait", set: { ...set, sec: set.sec.slice(), cats: set.cats.slice() }, tl: GAMES[set.game].tl[set.speed ? 1 : 0],
           names, chars, peers, qi: 0, total: 0, order: [], qid: null, perm: [], hp: names.map(() => 100), ans: names.map(() => null), res: null,
           stats: names.map(() => ({ ok: 0 })), combo: names.map(() => 0), items: names.map(() => ({ sh: 1 })), gears: names.map(() => ({})) };
}
const alive = (g, p) => g.hp[p] > 0;
const aliveCount = g => g.hp.filter(h => h > 0).length;
function submit(g, p, choice, ms, sh){
  if (!g || g.phase !== "q" || g.ans[p] || !alive(g, p)) return false;
  const useSh = !!sh && g.items && g.items[p] && g.items[p].sh > 0;
  if (useSh) g.items[p].sh--;
  g.ans[p] = { choice, ms: Math.max(0, Math.min(g.tl, ms)), sh: useSh };
  return true;
}
const allIn = g => g.names.every((_, p) => !alive(g, p) || g.ans[p]);
function finalize(g){
  const q = QS[g.qid], tl = g.tl, sc = 1 / Math.max(1, aliveCount(g) - 1);
  const res = g.names.map((_, p) => { const dead = !alive(g, p), a = g.ans[p];
    const choice = a ? a.choice : null, ms = a ? a.ms : tl;
    return { choice, ms, ok: !dead && judge(q, choice), dmg: 0, bonus: 0, self: 0, first: false, dead, taken: 0, sh: !!(a && a.sh), blocked: 0, combo: 0 }; });
  res.forEach((r, p) => { if (r.dead) return; g.combo[p] = r.ok ? g.combo[p] + 1 : 0; r.combo = g.combo[p]; });
  if (!g.set.speed){
    res.forEach(r => { if (r.ok) r.dmg = Math.round((10 + 10 * Math.max(0, 1 - r.ms / tl)) * sc); });
  } else {
    const okP = res.map((r, p) => r.ok ? p : -1).filter(p => p >= 0);
    if (okP.length){ const w = okP.reduce((a, b) => res[b].ms < res[a].ms ? b : a); res[w].dmg = Math.round(25 * sc); res[w].first = true; }
    res.forEach(r => { if (!r.dead && !r.ok && r.choice !== null) r.self = 5; });
  }
  // 🔥 콤보 보너스: 2연속부터 +3, 최대 +9
  res.forEach(r => { if (r.dmg > 0 && r.combo >= 2){ r.bonus = Math.round(Math.min(r.combo - 1, 3) * 3 * sc); r.dmg += r.bonus; } });
  // ⚙️ 장비 특성: 공격력 +, 치명타(+5)
  const PK = p => (g.perks && g.perks[p]) || perksOf(null);
  res.forEach((r, p) => { if (r.dmg > 0){ r.dmg += PK(p).atk; if (PK(p).crit && Math.random() * 100 < PK(p).crit){ r.dmg += 5; r.crit = true; } } });
  // 받는 피해: 공격마다 방어력만큼 줄임(최소 1) · 🛡️ 방어막이면 전부 막음
  res.forEach((r, p) => {
    if (r.dead) return;
    let inc = 0; res.forEach((o, k) => { if (k !== p && o.dmg > 0) inc += Math.max(1, o.dmg - PK(p).def); });
    if (r.sh){ r.blocked = inc; inc = 0; } r.taken = inc + r.self;
  });
  res.forEach((r, p) => {
    const max = (g.maxhp && g.maxhp[p]) || 100;
    g.hp[p] = Math.max(0, g.hp[p] - r.taken);
    if (r.ok && g.hp[p] > 0 && PK(p).heal){ r.heal = Math.min(PK(p).heal, max - g.hp[p]); g.hp[p] += r.heal; }

function advance(g){

  g.qi++;

    const more = shuffle(poolFor(g.set));
    if (more.length > 1 && more[0] === g.order[g.order.length - 1]) [more[0], more[1]] = [more[1], more[0]];
    g.order = g.order.concat(more);
  }

}
function ranking(st){ return st.names.map((_, p) => p).sort((a, b) => (st.hp[b] - st.hp[a]) || (st.stats[b].ok - st.stats[a].ok)); }

function clearBots(){ ctl.bots.forEach(clearTimeout); ctl.bots = []; }

function scheduleBots(){

    ctl.bots.push(setTimeout(() => {
      if (!G || G.gid !== gid || G.qi !== qi || G.phase !== "q") return;
      const right = Math.random() < lv.acc;
      let c;

      else { const wrong = [...Array(q.o.length).keys()].filter(i => i !== q.a); c = right ? q.a : wrong[Math.floor(Math.random() * wrong.length)]; }
      const sh = G.hp[p] < 40 && Math.random() < .3;

    if (st.res[me] && st.res[me].ok && !awarded.has(k)){ awarded.add(k); award(1, "정답"); }
    if (!wrongSeen.has(k)){
      wrongSeen.add(k);
      if (wrongs.gid !== st.gid) wrongs = { gid: st.gid, list: [] };
      const missed = mode === "local" && !solo() ? st.res.some(r => !r.dead && !r.ok) : (st.res[me] && !st.res[me].dead && !st.res[me].ok);
      if (missed && !wrongs.list.includes(st.qid)) wrongs.list.push(st.qid);
    }
  }
  if (st.phase === "end"){
    const k = st.gid + ":end"; if (!awarded.has(k)){ awarded.add(k); const w = winnerOf(st); award(w === me ? 7 : 2, w === me ? "승리 보너스" : "완주 보너스"); }
  }
}

function changeSet(act, v){
  const target = mode === "host" ? G.set : (!mode ? cfg.set : null);

  if (act === "setgame" && GAMES[v]) target.game = v;
  else if (act === "setspeed") target.speed = v === "1";
  else if (act === "setplayers") target.players = v === "3" ? 3 : 2;
  else if (act === "setn"){ const n = parseInt(v, 10); if (NS.includes(n)) target.n = n; }
  else if (act === "setcat"){ const has = target.cats.includes(v); if (has && target.cats.length > 1) target.cats = target.cats.filter(x => x !== v); else if (!has && CATS.includes(v)) target.cats = CATS.filter(x => x === v || target.cats.includes(x)); }
  else if (act === "setsec"){ const s = parseInt(v, 10); const has = target.sec.includes(s); if (has && target.sec.length > 1) target.sec = target.sec.filter(x => x !== s); else if (!has) target.sec = [...target.sec, s].sort(); }
  if (mode === "host"){ G.tl = GAMES[G.set.game].tl[G.set.speed ? 1 : 0]; G.v++; syncWaitPlayers(); broadcast(); }
  else saveCfg();
  render();
}

// 정답 공개 직후 1.4초 동안: 공격한 캐릭터는 달려가서 때리고, 맞는 캐릭터는 막는다
let fightKey = null, fightAt = 0;
function fightFresh(st){
  if (!st || st.phase !== "reveal" || !st.res) return false;
  const k = st.gid + ":" + st.qi;
  if (k !== fightKey){ fightKey = k; fightAt = Date.now(); setTimeout(render, 1450); }
  return Date.now() - fightAt < 1400;
}
// p가 공격하는 상대 (데미지를 준 사람 중 첫 번째 대상)
function fightTarget(st, p){
  const r = st.res[p]; if (!r || r.dead || !(r.dmg > 0)) return -1;
  let best = -1;
  st.res.forEach((o, k) => { if (k !== p && !o.dead && (o.taken > 0 || o.blocked > 0) && !(o.dmg > 0) && best < 0) best = k; });
  if (best < 0) st.res.forEach((o, k) => { if (k !== p && !o.dead && best < 0) best = k; });
  return best;
}
function reaction(st, p){
  const c = chOf(st.chars[p]);
  if (st.phase === "reveal" && st.res && fightFresh(st)){
    const r = st.res[p];
    if (!r.dead && r.dmg > 0) return { cls: "atk" + (r.crit ? " crit" : ""), bub: r.crit ? "💥 치명타!" : "얍!", tgt: fightTarget(st, p) };
    const attacked = st.res.some((o, k) => k !== p && o.dmg > 0 && fightTarget(st, k) === p);
    if (!r.dead && attacked) return { cls: "blk", bub: r.sh && r.blocked > 0 ? "🛡️ 방어막!" : "막아라!", spark: r.sh && r.blocked > 0 ? "🛡️" : "💥" };
  }
  if (st.phase === "q"){
    if (st.hp[p] <= 0) return { cls: "ko", bub: "" };
    return gotOf(st, p) ? { cls: "think", bub: "✓" } : { cls: "idle", bub: "" };
  }
  if (st.phase === "reveal" && st.res){
    const r = st.res[p];
    if (r.dead) return { cls: "ko", bub: "" };
    const ko = st.hp[p] <= 0, hit = r.taken > 0 ? " hit" : "";
    if (r.ok){
      const bub = r.first ? "⚡ " + c.ok : (st.set.speed ? "한발 늦었다!" : (r.combo >= 3 ? `🔥 ${r.combo}콤보!` : c.ok));
      return { cls: "happy" + (r.combo >= 3 ? " fire" : "") + hit, bub };
    }
    if (r.sh && r.blocked > 0 && !ko) return { cls: "guard", bub: "🛡️ 막았다!" };
    if (r.choice === null) return { cls: (ko ? "ko" : "sleep") + hit, bub: ko ? "으앙 탈락…" : "시간 초과…zZ" };
    return { cls: (ko ? "ko" : "sad") + hit, bub: ko ? "으앙 탈락…" : c.bad };
  }
  return { cls: "idle", bub: "" };
}
function fighter(st, p, me){
  const reveal = st.phase === "reveal" && st.res;
  let stTxt = "", stCls = "";
  if (st.phase === "q"){
    if (st.hp[p] <= 0){ stTxt = "💫 탈락"; stCls = "bad"; }
    else { const got = gotOf(st, p); stTxt = got ? "답 제출 ✓" : "생각 중…"; stCls = got ? "ok" : ""; }
  } else if (reveal){
    const r = st.res[p];
    const bonus = r.bonus ? ` <span class="cb">🔥+${r.bonus}</span>` : "";
    if (r.dead){ stTxt = "💫 탈락"; stCls = "bad"; }
    else if (r.ok && st.set.speed){ stTxt = r.first ? `⚡ 먼저 정답! ⚔️ ${r.dmg}${bonus}` : "정답 (한발 늦음)"; stCls = r.first ? "ok" : ""; }
    else if (r.ok){ stTxt = `정답 ${(r.ms / 1000).toFixed(1)}초 · ⚔️ ${r.dmg}${bonus}`; stCls = "ok"; }
    else { stTxt = r.choice === null ? "시간 초과" : "오답" + (r.self ? ` (-${r.self})` : ""); stCls = "bad"; }
    if (!r.dead && r.sh) stTxt += r.blocked > 0 ? ` · 🛡️ ${r.blocked} 막음` : " · 🛡️ 사용";
  }
  const taken = reveal && !st.res[p].dead ? st.res[p].taken : 0;
  const rx = reaction(st, p);
  const combo = st.combo && st.combo[p] >= 2 ? `<span class="combo">🔥${st.combo[p]}</span>` : "";
  const shLeft = st.items && st.items[p] ? st.items[p].sh : 0;
  const max = (st.maxhp && st.maxhp[p]) || 100;
  if (reveal && !st.res[p].dead){ const r = st.res[p]; if (r.crit) stTxt += ` <span class="cb">💥치명타</span>`; if (r.heal) stTxt += ` <span class="hl">💚+${r.heal}</span>`; }
  return `<div class="fc f${p}" data-p="${p}" style="--pc:${PCOL[p]}">
    ${taken > 0 ? `<span class="dmg">-${taken}</span>` : ""}${combo}
    ${rx.spark ? `<span class="spark">${rx.spark}</span>` : ""}
    <div class="avwrap" ${rx.tgt >= 0 ? `data-tgt="${rx.tgt}"` : ""}>${avatar(st.chars[p], rx.cls, rx.bub, 0, emoFor(emoKey(st, p)), st.gears && st.gears[p])}</div>
    <div class="nm">${esc(st.names[p])}${me === p && mode !== "local" ? '<span class="me">나</span>' : ""}</div>
    <div class="hp"><i style="width:${Math.round(st.hp[p] / max * 100)}%"></i></div>
    <div class="hpn">HP ${st.hp[p]}${max > 100 ? "/" + max : ""}${shLeft ? " · 🛡️" + shLeft : ""}</div>
    <div class="st ${stCls}">${stTxt}</div>
  </div>`;
}

function renderBattle(st){
  const q = QS[st.qid], me = myIdx(), reveal = st.phase === "reveal", n = st.names.length;

  else if (me !== null && !multiLocal && st.hp[me] <= 0) banner = `<div class="banner">💫 탈락했어요 · 끝까지 관전해요</div>`;
  if (mode === "guest" && ON.hostPeer && !ON.hostHere) banner = `<div class="banner">방장 연결이 끊겼어요</div>`;

  const pend = myPending(), can = canAnswer(st), hidden = hintHidden(st);
  let answerUI = "";
  if (q.k === "type"){
    if (reveal) answerUI = `<div class="typeres">${st.res.map((r, p) => r.dead ? "" : `<div><span class="pk" style="background:${PCOL[p]}">${esc(st.names[p])}</span> ${r.choice === null ? "<i>시간 초과</i>" : esc(r.choice)} ${r.ok ? "✅" : "❌"}</div>`).join("")}</div>`;
    else if (!multiLocal){
      const hl = hint.key === qKey && hint.gid === st.gid ? `<div class="hintline">💡 ${q.a.split("").map((ch, i) => i % 2 === 0 ? ch : "_").join(" ")}</div>` : "";
      answerUI = hl + `<div class="typerow"><input type="text" id="typein" maxlength="30" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="${can ? "영어 단어 입력 후 Enter" : "제출 완료"}" ${can ? "" : "disabled"} value="${typeof pend === "string" ? esc(pend) : ""}"><button class="btn alt" data-act="typesub" ${can ? "" : "disabled"}>제출</button></div>`;
    }
  } else {
    const opts = st.perm.map((orig, i) => {
      let cls = q.k === "ox" ? "opt ox" : "opt";
      const picks = [];
      const gone = !reveal && hidden.includes(orig);
      if (reveal && st.res){ st.res.forEach((r, p) => { if (!r.dead && r.choice === orig) picks.push(p); }); if (orig === q.a) cls += " correct"; else if (picks.length) cls += " wrong"; }
      else if (pend === orig) cls += " picked";
      if (gone) cls += " gone";
      const label = q.k === "ox" ? `<span class="oxl ${orig === 0 ? "o" : "x"}">${q.o[orig]}</span>` : `<span class="mk">${MARKS[i]}</span><span class="ot">${esc(q.o[orig])}</span>`;
      return `<button class="${cls}" data-act="ans" data-i="${i}" ${can && !gone ? "" : "disabled"}>${label}
        ${picks.map(p => `<span class="pk" style="background:${PCOL[p]}">${chOf(st.chars[p]).e} ${esc(st.names[p])}</span>`).join("")}
        ${!multiLocal && !reveal ? `<kbd>${i + 1}</kbd>` : ""}</button>`;
    }).join("");
    answerUI = `<div class="opts ${q.k === "ox" ? "oxgrid" : ""}">${opts}</div>`;
  }
  const pads = multiLocal && st.phase === "q" ? `
    <div class="pads" style="grid-template-columns:repeat(${n},1fr)">
      ${st.names.map((nm, p) => { const done = !!G.ans[p] || !alive(G, p), sh = G.items[p].sh;
        return `<div class="pad" style="--pc:${PCOL[p]}"><div class="pn">${chOf(st.chars[p]).e} ${esc(nm)}</div>
          <div class="pbtns" style="grid-template-columns:repeat(${st.perm.length},1fr)">${st.perm.map((orig, i) => `<button data-act="pad" data-p="${p}" data-i="${i}" ${done ? "disabled" : ""}>${q.k === "ox" ? q.o[orig] : MARKS[i]}<small>${KEYS[p][i].toUpperCase()}키</small></button>`).join("")}</div>
          <button class="padsh ${padArmed[p] ? "on" : ""}" data-act="padsh" data-p="${p}" ${done || !sh ? "disabled" : ""}>🛡️ 방어막 ${sh ? (padArmed[p] ? "켜짐" : "×" + sh) : "없음"}</button>
          <div class="pst">${!alive(G, p) ? "💫 탈락" : G.ans[p] ? "답 제출 ✓" : ""}</div></div>`; }).join("")}
    </div>` : "";
  const items = !multiLocal && me !== null && st.phase === "q" && st.hp[me] > 0 ? `
    <div class="items">
      <button class="itm" data-act="hint" ${hintAvail(st) ? "" : "disabled"}>💡 힌트 <small>${q.k === "ox" ? "O/X는 불가" : q.k === "type" ? "글자 반 공개" : "오답 2개 지우기"} · ${hintLeft(st)}개</small></button>
      <button class="itm ${myArmed ? "on" : ""}" data-act="arm" ${can && myShields(st) > 0 ? "" : "disabled"}>🛡️ 방어막 <small>${myArmed ? "켜짐! 답하면 발동" : "공격 1번 막기"} · ${myShields(st)}개</small></button>
    </div>` : "";
  const crowd = ON && mode !== "local" ? ON.members.filter(m => !st.peers.includes(m.peer) && emoFor(m.peer)) : [];
  const ansTxt = q.k === "mc" ? `${MARKS[st.perm.indexOf(q.a)]} ${esc(q.o[q.a])}` : esc(q.k === "ox" ? q.o[q.a] : q.a);
  const explain = reveal ? `<div class="explain"><b>정답: ${ansTxt}</b><br>💡 ${esc(q.e)}</div>` : "";
  const canNext = reveal && (mode === "local" || mode === "host");
  const g = GAMES[st.set.game];
  const cards = n === 2 ? `${fighter(st, 0, me)}<div class="vs">VS</div>${fighter(st, 1, me)}` : st.names.map((_, p) => fighter(st, p, me)).join("");
  $app.innerHTML = `
  <div class="battle n${n}${multiLocal ? " ml" : ""}${(mode === "host" || mode === "guest") ? " haschat" : ""}">
    <div class="b-top">
      <div class="topbar"><span class="tt">${g.icon} ${g.name} · ${n}인 · ${st.set.speed ? "⚡스피드" : "🐢일반"}${solo() ? " · 🤖" + BOT_LV[G.bot].name : mode === "local" ? " · 같은 화면" : " · 방 " + esc(ON.code.toUpperCase())}</span>
        <span class="tb">${chatBtn()} ${soundBtn()} ${mode === "host" ? `<button class="linkbtn" data-act="tolobby">대기실로</button>` : ""} <button class="linkbtn" data-act="leave">나가기</button></span></div>
      ${banner}
    </div>
    <div class="b-side">
      <div class="fighters n${n}">${cards}</div>
      ${crowd.length ? `<div class="crowd">👀 관중석 ${crowd.map(m => `${esc(m.name)} ${emoFor(m.peer)}`).join(" · ")}</div>` : ""}
      ${!multiLocal ? emoBarHTML() : ""}
      ${(mode === "host" || mode === "guest") ? `<div class="chatslot side"></div>` : ""}
    </div>
    <div class="b-main">
      <div class="meta">문제 ${st.qi + 1}${st.total ? " / " + st.total : " · ♾️"} <span class="chip">${SEC[q.s]}</span><span class="chip">${CAT_ICON[q.c] || ""} ${catName(q.c)}</span>${st.phase === "q" ? `<span class="tsec">⏱ <span id="tsec">${Math.ceil(st.tl / 1000)}</span>초</span>` : ""}</div>
      ${st.phase === "q" ? `<div class="timer"><div id="tbar"></div></div>` : ""}
      ${items}
      <div class="qcard">
        <div class="q">${q.q}</div>
        ${answerUI}
        ${explain}
      </div>
      ${pads}
      ${canNext ? `<div class="bar"><span class="sub" style="margin:0">잠시 후 다음 문제로 넘어가요</span><button class="btn alt" data-act="next">바로 다음 ▶</button></div>` : ""}
    </div>
    ${(mode === "host" || mode === "guest") ? `<div class="chatslot bar"></div>` : ""}
  </div>`;
  tick();
}

function renderEnd(st){

  </div>`;

/* ====== 타이머 ====== */
function tick(){
  const st = view();
  if (!st || st.phase !== "q") return;
  const left = Math.max(0, st.tl - (Date.now() - qStart));
  const bar = document.getElementById("tbar"), tx = document.getElementById("tsec");
  if (bar){ bar.style.width = (left / st.tl * 100) + "%"; bar.classList.toggle("low", left < st.tl / 3); }
  if (tx) tx.textContent = Math.ceil(left / 1000);
  if (left > 0 && left <= 3000){
    const sec = Math.ceil(left / 1000);
    if (sec !== snd.t){ snd.t = sec; if (mode === "local" ? !allIn(G) : canAnswer(st)) SFX.tick(); }
  }
  if (left > 0) return;
  if (mode === "local"){ if (G.phase === "q"){ finalize(G); onAuthorityChange(); } }
  else if (mode === "host"){ if (!G.ans[0] && alive(G, 0)) hostAnswer(null); }
  else if (mode === "guest"){ if (canAnswer(st)) guestAnswer(null); }
}
setInterval(tick, 100);

/* ====== 입력 ====== */
$app.addEventListener("click", e => {
  const b = e.target.closest("[data-act],[data-stop]"); if (!b || b.disabled) return;
  if (b.dataset.stop && !e.target.closest("[data-act]")) return;
  const t = e.target.closest("[data-act]"); if (!t || t.disabled) return;
  if (t.classList.contains("modal") && e.target !== t) return;
  if (cfg.sound) audio(); // 첫 클릭에 효과음 켜기 (브라우저 정책)
  const act = t.dataset.act, i = parseInt(t.dataset.i, 10);
  if (!mode && !["shop", "closeshop", "pickch", "armory", "closearm", "armtab", "equip", "unequip", "gacha", "gachaok"].includes(act)) readMenu();
  if (act === "local") startLocal();
  else if (act === "solo") startSolo(t.dataset.v);
  else if (act === "host") createRoom();
  else if (act === "join") joinRoom();
  else if (act === "start") hostStart();
  else if (act === "leave") leave();
  else if (act === "next") goNext();
  else if (act === "tolobby") toLobby();
  else if (act === "relocal"){ clearRoundTimers(); clearTimeout(ctl.next); G = newGame(G.names, G.chars, G.peers, G.set, Object.assign({ gears: G.gears }, G.bot ? { bot: G.bot } : {})); render(); }
  else if (act === "ans") onlineAnswer(i);
  else if (act === "pad") localAnswer(parseInt(t.dataset.p, 10), i);
  else if (act === "padsh"){ const p = parseInt(t.dataset.p, 10); if (G && G.phase === "q" && !G.ans[p] && G.items[p].sh > 0){ padArmed[p] = !padArmed[p]; render(); } }
  else if (act === "arm"){ const st = view(); if (canAnswer(st) && myShields(st) > 0){ myArmed = !myArmed; if (myArmed) SFX.shield(); render(); } }
  else if (act === "hint") useHint();
  else if (act === "emo") sendEmo(t.dataset.v);
  else if (act === "chat"){ CHAT.open = !CHAT.open; if (CHAT.open){ CHAT.unread = 0; CHAT.drawn = -1; } render(); if (CHAT.open){ const i = document.getElementById("cin"); if (i && window.innerWidth > 700) i.focus(); } }
  else if (act === "sound"){ cfg.sound = !cfg.sound; saveCfg(); if (cfg.sound) SFX.pop(); render(); }
  else if (act === "typesub") typeSubmit();
  else if (act === "toggleopp") toggleOpp(t.dataset.peer);
  else if (act === "handoff") handoff(t.dataset.peer);
  else if (act === "shop"){ shopOpen = true; armoryOpen = false; render(); }
  else if (act === "armory"){ armoryOpen = true; shopOpen = false; gachaRes = null; render(); }
  else if (act === "closearm"){ armoryOpen = false; gachaRes = null; render(); }
  else if (act === "armtab"){ if (SLOT_NAME[t.dataset.v]) armTab = t.dataset.v; render(); }
  else if (act === "equip") equip(t.dataset.v);
  else if (act === "unequip"){ if (SLOT_NAME[t.dataset.v]){ wallet.gear[t.dataset.v] = null; gearChanged(); } }
  else if (act === "gacha") gacha(t.dataset.v === "5" ? 5 : 1);
  else if (act === "gachaok"){ gachaRes = null; render(); }
  else if (act === "closeshop"){ shopOpen = false; render(); }
  else if (act === "pickch") selectChar(t.dataset.v);
  else if (act.startsWith("set")) changeSet(act, t.dataset.v);
});
$app.addEventListener("keydown", e => {
  if (e.key !== "Enter") return;
  if (e.target.id === "code"){ e.preventDefault(); joinRoom(); }
  else if (e.target.id === "typein"){ e.preventDefault(); typeSubmit(); }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && shopOpen){ shopOpen = false; return render(); }
  if (e.key === "Escape" && armoryOpen){ armoryOpen = false; gachaRes = null; return render(); }
  if (e.key === "Escape" && CHAT.open){ CHAT.open = false; return render(); }
  if (!mode || (e.target && e.target.tagName === "INPUT")) return;
  const st = view(); if (!st || st.phase !== "q") return;
  const k = String(e.key).toLowerCase();
  if (mode === "local" && !solo()){
    for (let p = 0; p < st.names.length; p++){ const i = KEYS[p].indexOf(k); if (i >= 0){ e.preventDefault(); return localAnswer(p, i); } }
  } else { const i = KEYS[0].indexOf(k); if (i >= 0){ e.preventDefault(); onlineAnswer(i); } }
});

// 실수로 새로고침·뒤로 가기 해서 게임이 날아가지 않게
window.addEventListener("beforeunload", e => {
  if (ON || (mode === "local" && G && G.phase !== "end")){ e.preventDefault(); e.returnValue = ""; }
});

render();

</script>
</body>
</html>
